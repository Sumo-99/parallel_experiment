[project]
name = "climate-brief"
version = "0.4.2"
description = "Weekly climate-tech market brief for the investment team, built on Exa search."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25"]

[project.scripts]
climate-brief = "brief.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
