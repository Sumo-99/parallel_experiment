# Search settings for the weekly brief.
# The investment team only trusts a handful of outlets, and the brief covers
# news since the start of the current fund quarter.

[search]
# "parallel" or "exa". Exa is kept as a fallback: set provider = "exa" to switch back.
provider = "parallel"
type = "auto"
include_domains = [
  "techcrunch.com",
  "canarymedia.com",
  "utilitydive.com",
  "electrek.co",
  "heatmap.news",
  "latitudemedia.com",
]
start_published_date = "2026-09-01"
num_results = 8
# Results scored below this are too loosely related to the query to be worth
# an analyst's time. Tuned on the Q2 briefs.
min_score = 0.18
# Note: Parallel results are ranked but have no relevance score, so min_score
# only filters results when provider = "exa".

[output]
max_items_per_section = 5
